<div class="calendar-page">
  <h1>Attendance Calendar</h1>

  <mat-tab-group animationDuration="150ms">
    @if (canManage()) {
    <mat-tab label="Manage Calendar"><app-manage-calendar /></mat-tab>
    }
    <mat-tab label="Missing Attendance"><app-missing-attendance /></mat-tab>
    @if (canManage()) {
    <mat-tab label="Settings"><app-attendance-settings /></mat-tab>
    }
  </mat-tab-group>
</div>
