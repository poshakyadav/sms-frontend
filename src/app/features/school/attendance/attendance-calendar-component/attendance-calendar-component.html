<mat-tab-group
  class="attendance-calendar-tabs"
  [selectedIndex]="initialTabIndex"
  animationDuration="150ms"
>
  <mat-tab label="Manage Calendar" [disabled]="!canManage()">
    <ng-template matTabContent>
      <app-manage-calendar />
    </ng-template>
  </mat-tab>

  <mat-tab label="Missing Attendance">
    <ng-template matTabContent>
      <app-missing-attendance />
    </ng-template>
  </mat-tab>

  <mat-tab label="Settings" [disabled]="!canManage()">
    <ng-template matTabContent>
      <app-attendance-settings />
    </ng-template>
  </mat-tab>
</mat-tab-group>
