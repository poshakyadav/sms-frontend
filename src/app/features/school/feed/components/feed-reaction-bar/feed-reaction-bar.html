<!-- features/school/feed/components/feed-reaction-bar/feed-reaction-bar.html -->

<div class="reaction-bar">
  <div class="reaction-summary">
    @if (totalReactions() > 0) {
    <div class="reaction-pills">
      @for (entry of reactionsSafe() | keyvalue; track entry.key) { @if (entry.value > 0) {
      <span class="reaction-pill"> {{ getEmoji(entry.key) }} {{ entry.value }} </span>
      } }
    </div>
    }
  </div>

  <div class="reaction-action" (mouseleave)="closePicker()">
    <button
      type="button"
      class="react-button"
      [class.is-active]="myReaction() !== null"
      (click)="togglePicker()"
    >
      @if (myReaction()) {
      <span>{{ getEmoji(myReaction()!) }}</span>
      <span>{{ myReaction() }}</span>
      } @else {
      <span>👍</span>
      <span>React</span>
      }
    </button>

    @if (isPickerOpen()) {
    <div class="reaction-picker">
      @for (option of options; track option.value) {
      <button
        type="button"
        class="picker-option"
        [class.is-selected]="myReaction() === option.value"
        [title]="option.label"
        (click)="pick(option.value)"
      >
        {{ option.emoji }}
      </button>
      }
    </div>
    }
  </div>
</div>
