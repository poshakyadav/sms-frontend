<!-- id-card-preview.html -->

<div
  #cardRoot
  class="id-card"
  [class.id-card--student]="card().holderType === 'STUDENT'"
  [class.id-card--staff]="card().holderType === 'STAFF'"
  [class.id-card--vertical]="orientation() === 'vertical'"
  [style.--accent-color]="card().template.layoutConfig.accentColor"
  [style.--accent-text-color]="card().template.layoutConfig.accentTextColor"
  [style.--bg-color]="card().template.layoutConfig.backgroundColor"
>
  <div class="id-card__status-stamp" *ngIf="card().status !== 'ACTIVE'">
    {{ card().status }}
  </div>

  <div class="id-card__header">
    <img
      *ngIf="card().template.layoutConfig.showLogo && logoDataUrl()"
      class="id-card__logo"
      [src]="logoDataUrl()"
      alt=""
    />
    <div class="id-card__school-identity">
      <div class="id-card__school-name">{{ card().school.name }}</div>
      <div
        class="id-card__school-tagline"
        *ngIf="card().template.layoutConfig.showTagline && card().school.tagline"
      >
        {{ card().school.tagline }}
      </div>
    </div>
    <div class="id-card__card-type">
      {{ cardTypeLabel() }}
    </div>
  </div>

  <div class="id-card__body">
    <div class="id-card__photo-col">
      <div class="id-card__photo-frame">
        <img *ngIf="photoDataUrl()" [src]="photoDataUrl()" alt="" class="id-card__photo" />
        <div class="id-card__photo-placeholder" *ngIf="!photoDataUrl()">
          {{ card().holderName.charAt(0) }}
        </div>
      </div>
    </div>

    <div class="id-card__details-col">
      <div class="id-card__holder-name">{{ card().holderName }}</div>
      <!-- <div class="id-card__role-line" *ngIf="card().holderType === 'STAFF'">{{ roleLine() }}</div> -->

      <div
        class="id-card__field-grid"
        [class.id-card__field-grid--compact]="fieldDensity() === 'compact'"
        [class.id-card__field-grid--tight]="fieldDensity() === 'tight'"
      >
        <div class="id-card__field" *ngFor="let f of displayFields()">
          <span class="id-card__field-label">{{ f.label }}</span>
          <span class="id-card__field-value">{{ f.value }}</span>
        </div>
      </div>
    </div>

    <div class="id-card__qr-col">
      <img *ngIf="qrDataUrl()" [src]="qrDataUrl()" alt="Verification QR code" class="id-card__qr" />
      <div class="id-card__card-number">{{ card().cardNumber }}</div>
    </div>
  </div>

  <div class="id-card__footer">
    <span class="id-card__validity">Valid until {{ formattedValidUntil() }}</span>
    <span class="id-card__footer-note" *ngIf="card().template.layoutConfig.footerNote">
      {{ card().template.layoutConfig.footerNote }}
    </span>
  </div>
</div>
