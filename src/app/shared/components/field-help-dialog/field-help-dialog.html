<!-- src/app/shared/components/field-help-dialog/field-help-dialog.html -->
<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <div [innerHTML]="data.content"></div>
  <!-- Use innerHTML for formatted text; ensure content is safe -->
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button color="primary" (click)="dialogRef.close()">Close</button>
</mat-dialog-actions>
