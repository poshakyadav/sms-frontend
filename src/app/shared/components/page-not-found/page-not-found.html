<div class="not-found-container">
  <mat-card class="not-found-card">
    <mat-card-header>
      <mat-card-title>404 - Page Not Found</mat-card-title>
      <mat-card-subtitle>Oops! The page you're looking for doesn't exist.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-icon
        aria-hidden="false"
        aria-label="404 icon"
        fontIcon="error_outline"
        class="icon"
      ></mat-icon>
      <p>It might have been moved or deleted. Let's get you back on track.</p>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-raised-button color="primary" (click)="goHome()">Go to Home</button>
    </mat-card-actions>
  </mat-card>
</div>
