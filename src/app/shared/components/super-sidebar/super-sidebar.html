<!--  super-sidebar.html  -->

<!-- Mobile backdrop -->
<div
  class="mobile-backdrop"
  [class.visible]="mobileOpen()"
  (click)="closeMobile()"
  aria-hidden="true"
></div>

<!-- ── Logout Confirmation Modal ─────────────────────────────────────────── -->
<div
  class="logout-modal-overlay"
  [class.visible]="logoutModalOpen()"
  (click)="cancelLogout()"
  aria-modal="true"
  role="dialog"
  aria-labelledby="logout-modal-title"
>
  <div class="logout-modal" (click)="$event.stopPropagation()">
    <div class="logout-modal-accent" aria-hidden="true"></div>

    <div class="logout-modal-icon-wrap">
      <div class="logout-modal-icon-ring"></div>
      <mat-icon class="logout-modal-icon">logout</mat-icon>
    </div>

    <h3 class="logout-modal-title" id="logout-modal-title">Sign Out?</h3>
    <p class="logout-modal-body">
      You are about to end your current admin session.<br />
      Any unsaved changes will be lost.
    </p>

    <div class="logout-modal-actions">
      <button class="modal-btn cancel-btn" (click)="cancelLogout()" type="button">
        <mat-icon>close</mat-icon>
        <span>Stay</span>
      </button>
      <button class="modal-btn confirm-btn" (click)="confirmLogout()" type="button">
        <mat-icon>logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</div>

<!-- ── Sidebar ───────────────────────────────────────────────────────────── -->
<aside
  class="super-sidebar"
  [class.collapsed]="isCollapsed()"
  [class.mobile-open]="mobileOpen()"
  role="navigation"
  aria-label="Super admin navigation"
>
  <!-- Grid background texture -->
  <div class="sidebar-grid-bg" aria-hidden="true"></div>

  <!-- ── Brand ────────────────────────────────────────────────────────── -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      <mat-icon class="brand-icon">admin_panel_settings</mat-icon>
      <div class="logo-ring"></div>
    </div>

    <div class="brand-text-wrap" *ngIf="!isCollapsed() || mobileOpen()">
      <span class="brand-title">SUPER</span>
      <span class="brand-sub">Admin Portal</span>
    </div>
  </div>

  <!-- ── Role strip ────────────────────────────────────────────────────── -->
  <div class="role-strip" *ngIf="!isCollapsed() || mobileOpen()">
    <div class="role-indicator">
      <span class="role-dot"></span>
      <span class="role-text">{{ roleLabel() }}</span>
    </div>
  </div>

  <!-- ── Navigation ────────────────────────────────────────────────────── -->
  <nav class="sidebar-nav" role="menubar">
    <ng-container *ngFor="let group of filteredGroups()">
      <div class="nav-group-label" *ngIf="group.groupLabel && (!isCollapsed() || mobileOpen())">
        {{ group.groupLabel }}
      </div>

      <div
        class="nav-group-divider"
        *ngIf="group.groupLabel && isCollapsed() && !mobileOpen()"
      ></div>

      <a
        *ngFor="let item of group.items"
        class="nav-item"
        [class.active]="isItemActive(item)"
        [routerLink]="item.route"
        matRipple
        matRippleColor="rgba(0, 212, 255, 0.08)"
        [matTooltip]="isCollapsed() && !mobileOpen() ? item.label : ''"
        matTooltipPosition="right"
        role="menuitem"
      >
        <div class="active-scanline" *ngIf="isItemActive(item)"></div>

        <span class="nav-icon-wrap">
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        </span>

        <span class="nav-label" *ngIf="!isCollapsed() || mobileOpen()">{{ item.label }}</span>

        <span
          class="nav-badge"
          *ngIf="item.badge && (!isCollapsed() || mobileOpen())"
          [class]="item.badgeType ?? 'info'"
          >{{ item.badge }}</span
        >

        <span class="active-bar" *ngIf="isItemActive(item)"></span>
      </a>
    </ng-container>
  </nav>

  <!-- ── Footer ────────────────────────────────────────────────────────── -->
  <div class="sidebar-footer">

    <!-- <div class="footer-divider"></div> -->

    <div class="user-row" [class.collapsed]="isCollapsed() && !mobileOpen()">
      <div class="user-avatar">{{ userInitials() }}</div>
      <div class="user-meta" *ngIf="!isCollapsed() || mobileOpen()">
        <span class="user-name">{{ userName() }}</span>
        <span class="user-role">{{ roleLabel() }}</span>
      </div>
    </div>

    <button
      class="logout-btn"
      (click)="openLogoutModal()"
      [matTooltip]="isCollapsed() && !mobileOpen() ? 'Sign out' : ''"
      matTooltipPosition="right"
      aria-label="Sign out"
    >
      <mat-icon>logout</mat-icon>
      <span *ngIf="!isCollapsed() || mobileOpen()">Sign Out</span>
    </button>
  </div>

  <!-- ── Collapse toggle pill — lives OUTSIDE overflow:hidden area ─────── -->
  <!-- Absolutely positioned so it straddles the sidebar's right border.   -->
  <!-- Hidden on mobile (hamburger in header handles that instead).         -->
  <button
    class="collapse-btn"
    (click)="toggleCollapse()"
    [matTooltip]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    matTooltipPosition="right"
    [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
  >
    <mat-icon>{{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
  </button>
</aside>
