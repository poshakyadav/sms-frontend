@if (updateAvailable() && !dismissed()) {
<div
  class="update-modal-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="update-modal-title"
>
  <div class="update-modal">
    <div class="update-modal__icon">
      <svg
        viewBox="0 0 24 24"
        width="26"
        height="26"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M21 12a9 9 0 1 1-3-6.7" />
        <path d="M21 3v6h-6" />
      </svg>
    </div>
    <h2 id="update-modal-title" class="update-modal__title">A new version of Eduxo is available</h2>
    <p class="update-modal__message">
      We've made some improvements. Reload to get the latest version.
    </p>
    <div class="update-modal__actions">
      <button
        type="button"
        class="update-modal__btn update-modal__btn--secondary"
        (click)="dismiss()"
      >
        Not now
      </button>
      <button
        type="button"
        class="update-modal__btn update-modal__btn--primary"
        (click)="refresh()"
      >
        Reload now
      </button>
    </div>
  </div>
</div>
}
